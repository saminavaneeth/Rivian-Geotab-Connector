<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rivian × Geotab OEM Connector — Enhanced</title>
<style>
  :root {
    --bg:        #0f1117;
    --surface:   #1a1d27;
    --surface2:  #22263a;
    --border:    #2e3350;
    --rivian:    #00a651;
    --geotab:    #0073e6;
    --warn:      #f59e0b;
    --danger:    #ef4444;
    --critical:  #dc2626;
    --text:      #e2e8f0;
    --muted:     #64748b;
    --radius:    10px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 13px;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 24px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
  }

  .logo {
    font-size: 16px;
    font-weight: 700;
    letter-spacing: -0.3px;
  }

  .logo .rivian  { color: var(--rivian); }
  .logo .sep     { color: var(--muted); margin: 0 4px; }
  .logo .geotab  { color: var(--geotab); }
  .logo .tag     { font-size: 11px; font-weight: 400; color: var(--muted); margin-left: 8px; }

  .live-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--rivian);
    animation: pulse 2s infinite;
    flex-shrink: 0;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); box-shadow: 0 0 0 0 rgba(0,166,81,.4); }
    50% { opacity: .7; transform: scale(1.1); box-shadow: 0 0 0 5px rgba(0,166,81,0); }
  }

  .header-meta { margin-left: auto; color: var(--muted); font-size: 11px; display: flex; gap: 16px; align-items: center; }
  .dig-status { padding: 4px 10px; background: rgba(0,115,230,.1); border-radius: 6px; color: var(--geotab); font-size: 10px; }

  main { padding: 20px 24px; display: flex; flex-direction: column; gap: 20px; flex: 1; min-height: 0; }

  .kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }

  .kpi {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px 20px;
  }

  .kpi-label { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: .6px; margin-bottom: 6px; }
  .kpi-value { font-size: 24px; font-weight: 700; line-height: 1; }
  .kpi-value.green  { color: var(--rivian); }
  .kpi-value.blue   { color: var(--geotab); }
  .kpi-value.warn   { color: var(--warn); }
  .kpi-value.danger { color: var(--danger); }

  .kpi-sub { font-size: 10px; color: var(--muted); margin-top: 4px; }

  .section {
    display: grid;
    grid-template-columns: 2fr 1fr;
    gap: 20px;
    flex: 1;
    min-height: 0;
  }

  .panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  .panel-header {
    padding: 12px 16px;
    background: var(--surface2);
    border-bottom: 1px solid var(--border);
    font-weight: 600;
    font-size: 12px;
  }

  .panel-body {
    padding: 16px;
    flex: 1;
    overflow-y: auto;
    min-height: 0;
  }

  .fault-score-item {
    padding: 10px 12px;
    background: rgba(255,255,255,.02);
    border-radius: 6px;
    margin-bottom: 8px;
    border-left: 3px solid;
    font-size: 12px;
    cursor: pointer;
    transition: background 0.15s;
  }

  .fault-score-item:hover { background: rgba(255,255,255,.06); }

  .fault-score-item.selected {
    background: rgba(0,115,230,.1);
    border-left-width: 4px;
    outline: 1px solid rgba(0,115,230,.3);
  }

  .maintenance-context-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 6px 12px;
    background: rgba(0,115,230,.08);
    border-bottom: 1px solid rgba(0,115,230,.2);
    font-size: 11px;
    color: var(--geotab);
  }

  .maintenance-context-bar button {
    padding: 3px 8px;
    font-size: 10px;
    background: var(--surface2);
    color: var(--muted);
    border: 1px solid var(--border);
  }

  .severity-critical { border-left-color: var(--critical); }
  .severity-high     { border-left-color: var(--danger); }
  .severity-medium   { border-left-color: var(--warn); }
  .severity-low      { border-left-color: var(--geotab); }

  .fault-score-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 4px;
  }

  .fault-score-name { font-weight: 500; }
  .fault-score-badge {
    padding: 2px 8px;
    border-radius: 4px;
    font-size: 10px;
    font-weight: 600;
  }

  .badge-critical { background: rgba(220,38,38,.2); color: var(--critical); }
  .badge-high     { background: rgba(239,68,68,.2); color: var(--danger); }
  .badge-medium   { background: rgba(245,158,11,.2); color: var(--warn); }
  .badge-low      { background: rgba(0,115,230,.2); color: var(--geotab); }

  .fault-score-score { color: var(--muted); font-size: 11px; margin-top: 4px; }

  .fault-dismiss-btn {
    padding: 2px 8px;
    font-size: 10px;
    background: rgba(239,68,68,.12);
    color: var(--danger);
    border: 1px solid rgba(239,68,68,.3);
    border-radius: 4px;
    margin-left: 6px;
    flex-shrink: 0;
  }
  .fault-dismiss-btn:hover { background: rgba(239,68,68,.28); opacity: 1; }

  .maintenance-suggestion {
    padding: 12px;
    border-left: 3px solid;
    border-radius: 6px;
    margin-bottom: 10px;
  }

  .maintenance-critical { background: rgba(220,38,38,.12);  border-left-color: var(--critical); border-left-width: 4px; }
  .maintenance-high     { background: rgba(239,68,68,.08);  border-left-color: var(--danger); }
  .maintenance-medium   { background: rgba(245,158,11,.08); border-left-color: var(--warn); }
  .maintenance-low      { background: rgba(0,166,81,.08);   border-left-color: var(--rivian); }

  .maintenance-title-critical { font-weight: 700; color: var(--critical); margin-bottom: 4px; }
  .maintenance-title-high     { font-weight: 600; color: var(--danger);   margin-bottom: 4px; }
  .maintenance-title-medium   { font-weight: 600; color: var(--warn);     margin-bottom: 4px; }
  .maintenance-title-low      { font-weight: 600; color: var(--rivian);   margin-bottom: 4px; }
  .maintenance-detail { font-size: 12px; color: var(--text); margin-bottom: 4px; }
  .maintenance-parts {
    font-size: 11px;
    color: var(--muted);
    margin-top: 6px;
    padding-top: 6px;
    border-top: 1px solid rgba(255,255,255,.1);
  }

  button {
    padding: 8px 12px;
    background: var(--geotab);
    color: white;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-size: 11px;
    font-weight: 600;
    transition: opacity 0.2s;
  }

  button:hover { opacity: 0.85; }
  button.secondary { background: var(--surface2); color: var(--text); border: 1px solid var(--border); }

  .dig-panel {
    background: rgba(0,115,230,.05);
    border: 1px solid rgba(0,115,230,.2);
    border-radius: 6px;
    padding: 12px;
    font-size: 11px;
  }

  .dig-field {
    display: flex;
    justify-content: space-between;
    padding: 4px 0;
    border-bottom: 1px solid rgba(0,115,230,.1);
  }

  .dig-field:last-child { border-bottom: none; }

  .dig-field-label { color: var(--muted); }
  .dig-field-value { color: var(--geotab); font-weight: 500; }

  .empty-state {
    text-align: center;
    color: var(--muted);
    padding: 20px;
    font-size: 12px;
  }
</style>
</head>
<body>

<header>
  <span class="live-dot"></span>
  <div class="logo">
    <span class="rivian">Rivian</span>
    <span class="sep">×</span>
    <span class="geotab">Geotab</span>
    <span class="tag">OEM Connector • Enhanced</span>
  </div>
  <div class="header-meta">
    <span id="vehicle-count">0 vehicles</span>
    <span class="dig-status">DIG API • Prod-Ready</span>
  </div>
</header>

<main>
  <div class="kpis">
    <div class="kpi">
      <div class="kpi-label">Total Vehicles</div>
      <div class="kpi-value green" id="kpi-total">0</div>
    </div>
    <div class="kpi">
      <div class="kpi-label">Lowest Battery</div>
      <div class="kpi-value green" id="kpi-battery">—</div>
      <div class="kpi-sub" id="kpi-battery-vin"></div>
    </div>
    <div class="kpi">
      <div class="kpi-label">Charging</div>
      <div class="kpi-value blue" id="kpi-charging">0</div>
    </div>
    <div class="kpi">
      <div class="kpi-label">Active Faults</div>
      <div class="kpi-value danger" id="kpi-faults">0</div>
    </div>
  </div>

  <div class="section">
    <div class="panel">
      <div class="panel-header">⚠️ Fault Severity Scores (Dispatcher Priority)</div>
      <div class="panel-body" id="fault-scores-list">
        <div class="empty-state">No active faults</div>
      </div>
    </div>
    <div class="panel">
      <div class="panel-header">🔧 Maintenance Suggestions</div>
      <div class="panel-body" id="maintenance-list">
        <div class="empty-state">All vehicles healthy</div>
      </div>
    </div>
  </div>

</main>

<script>
const App = {
  vehicles: [],
  apiBase: window.location.origin.startsWith('http') ? window.location.origin : 'http://127.0.0.1:8000',

  async init() {
    setInterval(() => this.refresh(), 3000);
    this.refresh();
  },

  async refresh() {
    try {
      const res = await fetch(`${this.apiBase}/api/fleet`);
      this.vehicles = await res.json();
      this.render();
    } catch (e) {
      console.error('Fleet fetch failed:', e);
    }
  },

  render() {
    const v = this.vehicles;
    document.getElementById('vehicle-count').textContent = v.length + ' vehicles';

    // KPIs
    const charging = v.filter(x => x.charge_status === 'CHARGING').length;
    const faulted = v.reduce((sum, x) => sum + x.fault_codes.length, 0);
    const lowV = v.length ? v.reduce((min, x) => x.battery_percent < min.battery_percent ? x : min, v[0]) : null;
    const battEl = document.getElementById('kpi-battery');
    battEl.textContent = lowV ? `${Math.round(lowV.battery_percent)}%` : '—';
    battEl.className = 'kpi-value ' + (!lowV ? 'green' : lowV.battery_percent < 20 ? 'danger' : lowV.battery_percent < 30 ? 'warn' : 'green');
    document.getElementById('kpi-battery-vin').textContent = lowV ? `...${lowV.vin.slice(-6)}` : '';
    document.getElementById('kpi-total').textContent = v.length;
    document.getElementById('kpi-charging').textContent = charging;
    document.getElementById('kpi-faults').textContent = faulted;

    this.loadFaultScores();
    this.loadMaintenance();
  },

  async loadFaultScores() {
    try {
      const res = await fetch(`${this.apiBase}/api/fleet/faults/scores`);
      const scores = await res.json();
      
      let html = '';
      for (const [vin, data] of Object.entries(scores)) {
        for (const score of data.scores) {
          const levelClass = `severity-${score.severity_level.toLowerCase()}`;
          const badgeClass = `badge-${score.severity_level.toLowerCase()}`;
          html += `
            <div class="fault-score-item ${levelClass}" data-vin="${vin}" onclick="App.showMaintenanceForVin('${vin}', '${data.device_name}', '${score.rivian_fault_code}')">
              <div class="fault-score-header">
                <span class="fault-score-name">${score.fault_name}</span>
                <div style="display:flex;align-items:center;gap:4px;flex-shrink:0">
                  <span class="fault-score-badge ${badgeClass}">${score.severity_level}</span>
                  <button class="fault-dismiss-btn" onclick="event.stopPropagation(); App.dismissFault('${vin}', '${score.rivian_fault_code}')">✕ Dismiss</button>
                </div>
              </div>
              <div style="font-size:11px;color:var(--geotab);margin:2px 0">${data.device_name}</div>
              <div class="fault-score-score">Score: ${score.severity_score}/100 • ${score.recommendation}</div>
            </div>`;
        }
      }
      document.getElementById('fault-scores-list').innerHTML = html || '<div class="empty-state">No active faults</div>';
    } catch (e) {
      console.error('Fault scores fetch failed:', e);
    }
  },

  async showMaintenanceForVin(vin, deviceName, faultCode) {
    document.querySelectorAll('.fault-score-item').forEach(el => {
      el.classList.toggle('selected', el.dataset.vin === vin);
    });

    const list = document.getElementById('maintenance-list');
    list.innerHTML = '<div class="empty-state">Loading...</div>';

    let bar = document.querySelector('.maintenance-context-bar');
    if (!bar) {
      bar = document.createElement('div');
      bar.className = 'maintenance-context-bar';
      list.before(bar);
    }
    bar.innerHTML = `Showing: <strong>${deviceName}</strong> &nbsp;<button onclick="App.clearMaintenanceFocus()">Show All</button>`;

    try {
      const url = faultCode
        ? `${this.apiBase}/api/vehicle/${vin}/maintenance?fault_code=${encodeURIComponent(faultCode)}`
        : `${this.apiBase}/api/vehicle/${vin}/maintenance`;
      const res = await fetch(url);
      if (!res.ok) { list.innerHTML = '<div class="empty-state">No data</div>'; return; }
      const sug = await res.json();
      if (!sug || !sug.suggestion_type) {
        list.innerHTML = '<div class="empty-state">No maintenance needed</div>';
        return;
      }
      const u = sug.urgency || 'low';
      list.innerHTML = `
        <div class="maintenance-suggestion maintenance-${u}">
          <div class="maintenance-title-${u}">${sug.suggestion_type.replace(/_/g, ' ').toUpperCase()}</div>
          <div class="maintenance-detail">Vehicle: ${sug.vin}</div>
          <div class="maintenance-detail">Urgency: <strong>${sug.urgency}</strong></div>
          <div class="maintenance-detail">Downtime: ~${sug.estimated_downtime_hours}h</div>
          <div class="maintenance-detail">Reason: ${sug.reason}</div>
          <div class="maintenance-parts">Parts: ${sug.parts_likely_needed.join(', ')}</div>
        </div>`;
    } catch (e) {
      list.innerHTML = '<div class="empty-state">Error loading suggestion</div>';
    }
  },

  clearMaintenanceFocus() {
    document.querySelectorAll('.fault-score-item').forEach(el => el.classList.remove('selected'));
    const bar = document.querySelector('.maintenance-context-bar');
    if (bar) bar.remove();
    this.loadMaintenance();
  },

  async dismissFault(vin, faultCode) {
    try {
      const res = await fetch(`${this.apiBase}/api/vehicle/${vin}/faults/${faultCode}`, { method: 'DELETE' });
      if (res.ok) {
        // If this vehicle's fault was focused, clear the focus
        const bar = document.querySelector('.maintenance-context-bar');
        if (bar) {
          const focused = document.querySelector('.fault-score-item.selected');
          if (focused && focused.dataset.vin === vin) this.clearMaintenanceFocus();
        }
        await this.loadFaultScores();
        await this.loadMaintenance();
      }
    } catch (e) {
      console.error('Dismiss fault failed:', e);
    }
  },

  async loadMaintenance() {
    if (document.querySelector('.maintenance-context-bar')) return;
    try {
      const vins = this.vehicles.map(v => v.vin);
      const suggestions = [];
      
      for (const vin of vins) {
        const res = await fetch(`${this.apiBase}/api/vehicle/${vin}/maintenance`);
        if (res.ok) {
          const data = await res.json();
          if (data && data.suggestion_type) {
            suggestions.push(data);
          }
        }
      }
      
      let html = '';
      for (const sug of suggestions) {
        const u = sug.urgency || 'low';
        html += `
          <div class="maintenance-suggestion maintenance-${u}">
            <div class="maintenance-title-${u}">${sug.suggestion_type.replace(/_/g, ' ').toUpperCase()}</div>
            <div class="maintenance-detail">Vehicle: ${sug.vin}</div>
            <div class="maintenance-detail">Urgency: <strong>${sug.urgency}</strong></div>
            <div class="maintenance-detail">Downtime: ~${sug.estimated_downtime_hours}h</div>
            <div class="maintenance-detail">Reason: ${sug.reason}</div>
            <div class="maintenance-parts">Parts: ${sug.parts_likely_needed.join(', ')}</div>
          </div>`;
      }
      document.getElementById('maintenance-list').innerHTML = html || '<div class="empty-state">All vehicles healthy</div>';
    } catch (e) {
      console.error('Maintenance fetch failed:', e);
    }
  },

};

App.init();
</script>
</body>
</html>
